name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A92FED: ${{ secrets.A92FED }}
          B2953D: ${{ secrets.B2953D }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A92FED', '')
          sec_b = os.environ.get('B2953D', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- dd2098f451a406e0f505 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 857e09c9def3740dc9fcfd3c9746fe6d35 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
